- image: traefik:v3.0
  name: traefik
  env_form: none
  restart:
    condition: any
  auto_deploy: true
  network: admin-int
  ports:
    "80/tcp": "80"
    "443/tcp": "443"
    "8080/tcp": "8080"
  volumes:
    "/var/run/docker.sock": "/var/run/docker.sock"
    "/home/debian/proj/admin-int/certs": "/certs"
    # Todo: tfk labels here ?? (run.sh has em)
    # Todo: cleanup unused fields
    #"/home/bn/admin-int/certs": "/certs"
    # Todo: fix path issue ^^
- image: axis-camera:36e0971
  name: axis-camera-1
  env_form: axis-camera
  restart:
    condition: none
  network: admin-int
  features:
  - settings
  - metrics
  - edit_config
  - api_docs
  labels:
    traefik.enable: "true"
    traefik.http.routers.axis-camera-1.tls: true
    traefik.http.routers.axis-camera-1.rule: "Host(`axis.int.bastille.cloud`)"
    traefik.http.services.axis-camera-1.loadbalancer.server.port: "3030"
